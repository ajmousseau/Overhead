<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVERHEAD</title>
<style>
:root{--bg:#05080B;--gold:#F5A623;--line:rgba(245,166,35,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--gold);font-family:'Courier New',monospace;}
#app{height:100vh;display:flex;flex-direction:column;padding:14px 36px 10px;}
#hdr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;flex-shrink:0;}
.ht{font-size:9px;letter-spacing:7px;opacity:.38;}
.hl{font-size:10px;letter-spacing:3px;opacity:.6;}
.hc{font-size:11px;letter-spacing:2px;opacity:.28;font-variant-numeric:tabular-nums;}
#rows{flex:1;display:flex;flex-direction:column;min-height:0;}
.prow{flex:1;display:flex;align-items:center;border-bottom:1px solid var(--line);overflow:hidden;min-height:0;transition:opacity .6s;}
.prow:last-child{border-bottom:none;}
.part{flex:0 0 58%;height:100%;display:flex;align-items:center;padding:6px 0;overflow:hidden;}
.part svg{width:100%;height:100%;display:block;}
.pinfo{flex:1;padding:0 0 0 26px;border-left:1px solid rgba(245,166,35,0.15);display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;overflow:hidden;}
.pfl{font-size:clamp(15px,2.4vw,30px);letter-spacing:5px;font-weight:700;white-space:nowrap;}
.pan{font-size:clamp(7px,.9vw,11px);letter-spacing:4px;opacity:.42;margin-top:2px;white-space:nowrap;}
.pro{font-size:clamp(13px,1.9vw,22px);letter-spacing:4px;margin-top:5px;white-space:nowrap;}
.pci{font-size:clamp(7px,.8vw,9px);letter-spacing:2px;opacity:.36;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pst{display:flex;gap:clamp(8px,1.8vw,22px);margin-top:6px;flex-wrap:wrap;}
.psi{display:flex;flex-direction:column;gap:1px;}
.psv{font-size:clamp(10px,1.3vw,16px);letter-spacing:2px;}
.psl{font-size:clamp(5px,.65vw,8px);letter-spacing:2px;opacity:.28;margin-top:1px;}
.pty{font-size:clamp(6px,.75vw,9px);letter-spacing:3px;opacity:.3;margin-top:4px;}
.pempty{display:flex;align-items:center;width:100%;opacity:.06;font-size:9px;letter-spacing:6px;padding-left:8px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:7px;letter-spacing:3px;opacity:.65;margin-left:10px;vertical-align:middle;}
.bdot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;}
#ftr{flex-shrink:0;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:7px;letter-spacing:3px;opacity:.18;}
/* zip overlay */
#zo{display:none;position:fixed;inset:0;background:rgba(5,8,11,.97);z-index:2000;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#zo.show{display:flex;}
#zi{background:transparent;border:1px solid rgba(245,166,35,.35);color:#F5A623;font-family:'Courier New',monospace;font-size:22px;letter-spacing:6px;padding:10px 18px;width:150px;text-align:center;outline:none;}
#zb{background:transparent;border:1px solid rgba(245,166,35,.35);color:#F5A623;font-family:'Courier New',monospace;font-size:9px;letter-spacing:3px;padding:10px 16px;cursor:pointer;}
#ze{font-size:8px;letter-spacing:3px;color:#C8102E;min-height:14px;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 4px);pointer-events:none;z-index:999;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fadein{animation:fadein .5s ease}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="ht">✈ &nbsp; OVERHEAD</div>
    <div class="hl" id="loc">LOCATING...</div>
    <div class="hc" id="clk">--:--:--</div>
  </div>
  <div id="rows">
    <div class="prow" id="r0"><div class="pempty">ACQUIRING SIGNAL...</div></div>
    <div class="prow" id="r1"><div class="pempty">— &nbsp; — &nbsp; —</div></div>
    <div class="prow" id="r2"><div class="pempty">— &nbsp; — &nbsp; —</div></div>
  </div>
  <div id="ftr">
    <span>ADS-B LOL · AIRLABS</span>
    <span id="upd">—</span>
    <span id="rlbl">50 MI RADIUS</span>
  </div>
</div>

<div id="zo">
  <div style="font-size:9px;letter-spacing:6px;opacity:.4;">✈ &nbsp; OVERHEAD</div>
  <div style="font-size:10px;letter-spacing:5px;opacity:.7;">ENTER ZIP CODE</div>
  <div style="display:flex;gap:8px;">
    <input id="zi" type="text" inputmode="numeric" maxlength="5" placeholder="49315"/>
    <button id="zb">GO</button>

</div>

// ── Fetch with timeout (compatible with older Android Chrome) ──
function fetchT(url, ms) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms || 9000);
  return fetch(url, { signal: ctrl.signal, cache: 'no-store' })
    .finally(() => clearTimeout(tid));
}

// ── SVG windows helper ──
function wins(y,x1,x2,gap,h){
  let s='';
  for(let x=x1;x<=x2;x+=gap) s+=`<rect x="${x}" y="${y}" width="${gap-3}" height="${h||5}" rx="1.5" fill="rgba(0,0,0,0.14)"/>`;

function buildNB(L,id,flip,wb){

  const WG   = `M270,${wy1} L${wA},${wB} L${wA-6},${wB+12} L340,${wy1+14} L270,${wy1+8}Z`;

  const ew   = wb ? 134 : 104;

  const EI   = `M${314},${ey+10} C${314},${ey} ${328},${ey} ${328},${ey+10} C${328},${ey+20} ${314},${ey+20} ${314},${ey+10}Z`;
  const W    = wb ? 720 : 710;
  const tr   = flip ? `translate(${W},0) scale(-1,1)` : '';
  const sy   = fy1+4, sw = 380, sx = 80, sh = fc - fy1 + 4;

  return `<svg viewBox="0 0 ${W} 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
<defs>

  <path d="${EI}" fill="${L.ed}"/>
  <path d="${FP}" fill="${L.f}"/>

  <rect x="${sx}" y="${sy}" width="${sw}" height="${fc - fy1 - 4}" fill="${L.s}" clip-path="url(#cp${id})"/>

  <path d="${HS}" fill="${L.b}"/>
  <path d="${FP}" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
</g></svg>`;
}

function buildSVG(tc, cs, hdg, idx){
  const sh  = getShp(tc);
  const L   = getLiv(cs);
  const W   = sh==='CRJ' ? 680 : sh==='RJ' ? 630 : 710;
  const flip= typeof hdg==='number' && hdg>180;
  switch(sh){
    case 'WB':  return buildNB(L,idx,flip,true);
    case 'RJ':  return buildRJ(L,idx,flip);
    case 'CRJ': return buildCRJ(L,idx,flip);
    default:    return buildNB(L,idx,flip,false);
  }
}

// ── State ──
let uLat=null, uLon=null;
let last=[];
const RC={};
let rQ=Promise.resolve();

// ── Helpers ──
function haversine(a1,b1,a2,b2){
  if(!a2||!b2) return Infinity;
  const R=3958.8,dr=(a2-a1)*Math.PI/180,dc=(b2-b1)*Math.PI/180;
  const a=Math.sin(dr/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dc/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function brng(a1,b1,a2,b2){
  const dL=(b2-b1)*Math.PI/180,y=Math.sin(dL)*Math.cos(a2*Math.PI/180);
  const x=Math.cos(a1*Math.PI/180)*Math.sin(a2*Math.PI/180)-Math.sin(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.cos(dL);
  return((Math.atan2(y,x)*180/Math.PI)+360)%360;
}
function compass(d){return['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];}

function dstate(mi){
  if(mi<=10)  return{lbl:'OVERHEAD',dot:'#50C878',op:1.0};
  if(mi<=25)  return{lbl:'NEARBY',  dot:'#F5A623',op:0.85};
  if(mi<=50)  return{lbl:'IN RANGE',dot:'#C4821C',op:0.65};
  return         {lbl:'DISTANT', dot:'#666',    op:0.45};
}

// ── AirLabs route lookup (staggered) ──
async function lookupRoute(cs){
  if(RC[cs]!==undefined) return;
  RC[cs]=null;
  rQ=rQ.then(()=>new Promise(r=>setTimeout(r,1800))).then(async()=>{
    try{
      const r=await fetchT(`https://airlabs.co/api/v9/flight?flight_icao=${encodeURIComponent(cs)}&api_key=${AIRLABS}`,9000);
      if(r.ok){const d=await r.json();const f=d?.response;if(f?.dep_iata&&f?.arr_iata){RC[cs]={from:f.dep_iata,to:f.arr_iata};render(last);}}
    }catch(e){}
  });
}

// ── Fetch flights ──
async function fetchFlights(){
  if(!uLat) return;
  try{
    const r=await fetchT(`https://api.adsb.lol/v2/lat/${uLat}/lon/${uLon}/dist/${RADIUS}`,10000);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const ac=(d.ac||[])
      .filter(a=>{
        if(!a.flight) return false;
        const cs=a.flight.trim().toUpperCase();
        return /^[A-Z]{2,3}\d/.test(cs)&&!/^N\d/.test(cs);
      })
      .map(a=>({...a,_d:haversine(uLat,uLon,a.lat,a.lon)}))
      .filter(a=>isFinite(a._d))
      .sort((a,b)=>a._d-b._d)
      .slice(0,3);

    // Seed routes from raw ADS-B data
    ac.forEach(a=>{
      if(a.dep_iata&&a.arr_iata){const cs=a.flight.trim().toUpperCase();if(RC[cs]===undefined)RC[cs]={from:a.dep_iata,to:a.arr_iata};}
    });

    last=ac; render(ac);

    ac.forEach(a=>{const cs=a.flight.trim().toUpperCase();if(RC[cs]===undefined)lookupRoute(cs);});

    document.getElementById('upd').textContent='UPDATED '+new Date().toLocaleTimeString('en-US',{hour12:false});
  }catch(e){
    console.warn('[fetch]',e.message);
    document.getElementById('r0').innerHTML=`<div class="pempty" style="opacity:.5">SIGNAL ERROR — ${e.message.slice(0,30).toUpperCase()}</div>`;
  }
}

// ── Render ──
function render(ac){
  for(let i=0;i<3;i++){
    const row=document.getElementById(`r${i}`);
    const a=ac[i];
    if(!a){row.innerHTML='<div class="pempty">— &nbsp; — &nbsp; —</div>';row.style.opacity='';row.style.borderLeft='';continue;}
    const cs   =a.flight.trim().toUpperCase();
    const route=RC[cs];
    const alt  =a.alt_baro&&a.alt_baro!=='ground'?parseInt(a.alt_baro):null;
    const spd  =a.gs?Math.round(a.gs):null;
    const hdg  =a.track?Math.round(a.track):null;
    const tc   =(a.t||'').toUpperCase();
    const name =alName(cs);
    const L    =getLiv(cs);
    const ds   =dstate(a._d);
    const dir  =uLat&&a.lat?compass(brng(uLat,uLon,a.lat,a.lon)):'';
    const distTxt=ds.lbl==='OVERHEAD'?`${a._d.toFixed(1)} MI`:`${a._d.toFixed(1)} MI ${dir}`;
    const from =route?.from||'';
    const to   =route?.to  ||'';
    const routeStr=from&&to?`${from} &thinsp;→&thinsp; ${to}`:route===null?'&mdash;':'<span style="opacity:.25;font-size:.65em;letter-spacing:3px">ROUTING...</span>';
    const cityStr=from&&to?`${AP[from]||from} → ${AP[to]||to}`:'';
    const typeName=FTYPES[tc]||tc||'';

    row.style.opacity=ds.op;
    row.style.borderLeft=`3px solid ${L.tc}30`;
    row.classList.add('fadein');

    row.innerHTML=`
      <div class="part">${buildSVG(tc,cs,hdg,i)}</div>
      <div class="pinfo">
        <div style="display:flex;align-items:baseline;gap:0;flex-wrap:nowrap;">
          <span class="pfl">${cs}</span>
          <span class="badge"><span class="bdot" style="background:${ds.dot}"></span>${ds.lbl}</span>
        </div>
        <div class="pan">${name}</div>
        <div class="pro">${routeStr}</div>
        ${cityStr?`<div class="pci">${cityStr}</div>`:''}
        <div class="pst">
          ${alt?`<div class="psi"><div class="psv">${alt.toLocaleString()}</div><div class="psl">FT MSL</div></div>`:''}
          ${spd?`<div class="psi"><div class="psv">${spd}</div><div class="psl">KNOTS</div></div>`:''}
          <div class="psi"><div class="psv" style="color:${ds.dot}">${distTxt}</div><div class="psl">DISTANCE</div></div>
          ${hdg!==null?`<div class="psi"><div class="psv">${hdg}°</div><div class="psl">HEADING</div></div>`:''}
        </div>
        ${typeName?`<div class="pty">${typeName}</div>`:''}
      </div>`;
  }
}

// ── Location ──
function showZip(){
  document.getElementById('zo').classList.add('show');
  const zi=document.getElementById('zi'),zb=document.getElementById('zb'),ze=document.getElementById('ze');
  const go=()=>{const z=zi.value.trim();if(!/^\d{5}$/.test(z)){ze.textContent='ENTER 5-DIGIT ZIP';return;}ze.textContent='';document.getElementById('zo').classList.remove('show');resolveZip(z);};
  zb.onclick=go; zi.onkeydown=e=>{if(e.key==='Enter')go();};
  setTimeout(()=>zi.focus(),100);
}

async function resolveZip(zip){
  document.getElementById('loc').textContent='RESOLVING...';
  try{
    const r=await fetchT(`https://api.zippopotam.us/us/${zip}`,6000);
    if(!r.ok)throw new Error('bad zip');
    const d=await r.json();
    uLat=parseFloat(d.places[0].latitude); uLon=parseFloat(d.places[0].longitude);
    const city=d.places[0]['place name'],state=d.places[0]['state abbreviation'];
    document.getElementById('loc').textContent=city.toUpperCase()+', '+state;
    localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));
    localStorage.setItem('oh_zip',zip);
    fetchFlights();
  }catch(e){document.getElementById('loc').textContent='ZIP ERROR';showZip();}
}

function initLoc(){
  // Check saved locations (this app, then flightboard)
  const saved=localStorage.getItem('oh_ll')||localStorage.getItem('flightboard_loc');
  if(saved){try{[uLat,uLon]=JSON.parse(saved);const[la,lo]=[uLat,uLon];document.getElementById('loc').textContent=`${Math.abs(la).toFixed(3)}° ${la>=0?'N':'S'}, ${Math.abs(lo).toFixed(3)}° W`;fetchFlights();}catch(e){uLat=null;}}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{uLat=p.coords.latitude;uLon=p.coords.longitude;localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));document.getElementById('loc').textContent=`${uLat.toFixed(3)}° N, ${Math.abs(uLon).toFixed(3)}° W`;fetchFlights();},
      ()=>{if(!uLat){const z=localStorage.getItem('oh_zip');if(z)resolveZip(z);else showZip();}},
      {timeout:8000,maximumAge:300000}
    );
  }else if(!uLat)showZip();
}

// ── Clock ──
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});}
setInterval(tick,1000);tick();

// ── Boot ──
setInterval(fetchFlights,30000);
initLoc();
</script>
