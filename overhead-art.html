<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVERHEAD</title>
<style>
:root{--bg:#04070A;--gold:#F5A623;--line:rgba(245,166,35,0.08);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--gold);font-family:'Courier New',monospace;}
#app{height:100vh;display:flex;flex-direction:column;padding:12px 32px 8px;}
#hdr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;flex-shrink:0;}
.ht{font-size:8px;letter-spacing:7px;opacity:.3;}
.hl{font-size:9px;letter-spacing:3px;opacity:.5;}
.hc{font-size:10px;letter-spacing:2px;opacity:.22;font-variant-numeric:tabular-nums;}
#rows{flex:1;display:flex;flex-direction:column;min-height:0;}

/* -- Each flight row -- */
.prow{
  flex:1;display:flex;align-items:stretch;
  border-bottom:1px solid var(--line);
  overflow:hidden;min-height:0;
  transition:opacity .8s;
}
.prow:last-child{border-bottom:none;}

/* -- Aircraft livery — the art -- */
.pimg{
  flex:0 0 72%;
  display:flex;align-items:center;justify-content:flex-start;
  overflow:hidden;padding:10px 0 10px 0;
  position:relative;
}
.pimg img.livery{
  width:100%;height:100%;
  object-fit:contain;
  object-position:left center;
  display:block;
}
/* Fallback logo — centered, smaller */
.pimg img.fallback{
  width:auto;height:38%;
  object-fit:contain;
  margin:auto;
  opacity:.55;
  filter:brightness(0) invert(1);
}
/* No image at all */
.pimg .no-img{
  font-size:clamp(28px,5vw,80px);
  letter-spacing:8px;opacity:.07;
  margin:auto;
}

/* -- Info panel — minimal caption -- */
.pinfo{
  flex:1;
  padding:0 0 0 20px;
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  justify-content:center;
  gap:0;min-width:0;overflow:hidden;
}
.pfl{
  font-size:clamp(18px,2.8vw,38px);
  letter-spacing:5px;font-weight:700;
  white-space:nowrap;line-height:1.1;
}
.palbadge{
  display:flex;align-items:center;gap:6px;
  margin-top:4px;
}
.palbadge .bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.plbl{font-size:clamp(6px,.8vw,9px);letter-spacing:3px;opacity:.4;}
.pro{
  font-size:clamp(16px,2.2vw,28px);
  letter-spacing:5px;
  margin-top:clamp(8px,1.5vh,18px);
  white-space:nowrap;
}
.pci{
  font-size:clamp(7px,.75vw,9px);
  letter-spacing:2px;opacity:.32;
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pdist{
  margin-top:clamp(8px,1.5vh,18px);
  font-size:clamp(11px,1.4vw,18px);
  letter-spacing:3px;
}
.pty{
  font-size:clamp(6px,.7vw,8px);
  letter-spacing:3px;opacity:.25;
  margin-top:clamp(4px,1vh,10px);
}
.pempty{display:flex;align-items:center;width:100%;opacity:.05;font-size:9px;letter-spacing:6px;padding-left:8px;}

#ftr{flex-shrink:0;border-top:1px solid var(--line);padding-top:7px;display:flex;justify-content:space-between;font-size:6px;letter-spacing:3px;opacity:.15;}
#zo{display:none;position:fixed;inset:0;background:rgba(4,7,10,.97);z-index:2000;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#zo.show{display:flex;}
#zi{background:transparent;border:1px solid rgba(245,166,35,.3);color:#F5A623;font-family:'Courier New',monospace;font-size:22px;letter-spacing:6px;padding:10px 18px;width:150px;text-align:center;outline:none;}
#zb{background:transparent;border:1px solid rgba(245,166,35,.3);color:#F5A623;font-family:'Courier New',monospace;font-size:9px;letter-spacing:3px;padding:10px 16px;cursor:pointer;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.09) 2px,rgba(0,0,0,.09) 4px);pointer-events:none;z-index:999;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fadein{animation:fadein .6s ease}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="ht">? &nbsp; OVERHEAD</div>
    <div class="hl" id="loc">LOCATING...</div>
    <div class="hc" id="clk">--:--:--</div>
  </div>
  <div id="rows">
    <div class="prow" id="r0"><div class="pempty">ACQUIRING SIGNAL...</div></div>
    <div class="prow" id="r1"><div class="pempty">&#8212; &nbsp; &#8212; &nbsp; &#8212;</div></div>
    <div class="prow" id="r2"><div class="pempty">&#8212; &nbsp; &#8212; &nbsp; &#8212;</div></div>
  </div>
  <div id="ftr">
    <span>ADS-B &middot; AIRLABS</span>
    <span id="upd">&#8212;</span>
    <span id="rlbl">50 MI</span>
  </div>
</div>
<div id="zo">
  <div style="font-size:9px;letter-spacing:6px;opacity:.4;">&#9992; &nbsp; OVERHEAD</div>
  <div style="font-size:10px;letter-spacing:5px;opacity:.7;">ENTER ZIP CODE</div>
  <div style="display:flex;gap:8px;">
    <input id="zi" type="text" inputmode="numeric" maxlength="5" placeholder="49315"/>
    <button id="zb">GO</button>
  </div>
  <div id="ze" style="font-size:8px;letter-spacing:3px;color:#C8102E;min-height:14px;"></div>
</div>
<script>
'use strict';

const AIRLABS = '7b14d0aa-9dbb-45cc-bcd0-31acac5a4e38';
const RADIUS  = 50;

const HAS_LIVERY = new Set([
  'AAL','AAY','ACA','AFR','ANA','ANZ','ASA','BAW','CPA','DAL',
  'DLH','ENY','ETD','EZY','FFT','FIN','GJS','IBE','JAL','JBU',
  'KAL','KLM','NKS','QFA','QTR','RPA','RYR','SAS','SIA','SKW',
  'SWA','THY','UAE','UAL','WJA'
]);

const HAS_LOGO = new Set([
  'AAL','AAR','AAY','ACA','AFR','AIC','AIQ','ANA','ANZ','ASA',
  'AUA','AVA','AZU','BAW','BEL','CAL','CCA','CES','CPA','CSN',
  'DAL','DLH','EIN','ELY','ENY','ETD','ETH','EVA','EZY','FDX',
  'FFT','FIN','GFA','GIA','GLO','HAL','IBE','IGO','JAL','JBU',
  'KAL','KLM','KQA','LAN','LOT','MAS','MSR','NKS','NOZ','OMA',
  'PAL','PDT','QFA','QTR','RAM','RPA','RYR','SAA','SAS','SIA',
  'SVA','SWA','TAP','THA','THY','TOM','TSC','UAE','UAL','UPS',
  'VLG','VOZ','WJA','WZZ'
]);

const TYPE_MAP = {
  B732:'73H',B733:'73H',B734:'73H',B735:'73H',B736:'73H',
  B737:'73H',B738:'738',B739:'739',B73W:'73H',
  B37M:'73H',B38M:'738',B39M:'739',B3XM:'73H',
  B752:'752',B753:'752',B762:'763',B763:'763',B764:'763',
  B772:'772',B773:'77W',B77L:'772',B77W:'77W',
  B788:'788',B789:'789',B78X:'78X',
  B741:'744',B742:'744',B743:'744',B744:'744',B748:'748',
  A318:'319',A319:'319',A320:'320',A321:'321',
  A20N:'320',A21N:'321',A19N:'319',A32S:'320',
  A332:'332',A333:'333',A338:'338',A339:'339',
  A342:'332',A343:'333',A345:'332',A346:'332',
  A359:'359',A35K:'35K',A380:'380',A388:'388',
  E170:'E75',E175:'E75',E75L:'E75',E70:'E75',
  E190:'E90',E195:'E90',E290:'E90',E295:'E90',
  CRJ1:'CR9',CRJ2:'CR9',CRJ7:'CR7',CRJ9:'CR9',CRJX:'CR9',
  CR7W:'CR7',CR9W:'CR9',
};

const AP = {
  ATL:'Atlanta',BOS:'Boston',CLT:'Charlotte',DEN:'Denver',DFW:'Dallas/Ft Worth',
  DTW:'Detroit',EWR:'Newark',IAD:'Dulles',IAH:'Houston',JFK:'New York JFK',
  LAX:'Los Angeles',LGA:'New York LGA',MCO:'Orlando',MIA:'Miami',
  MDW:'Chicago Midway',MSP:'Minneapolis',ORD:'Chicago',PHL:'Philadelphia',
  PHX:'Phoenix',SEA:'Seattle',SFO:'San Francisco',SLC:'Salt Lake City',
  AUS:'Austin',BNA:'Nashville',BWI:'Baltimore',CVG:'Cincinnati',
  CLE:'Cleveland',CMH:'Columbus',DCA:'Washington',GRR:'Grand Rapids',
  IND:'Indianapolis',MCI:'Kansas City',MEM:'Memphis',MKE:'Milwaukee',
  MSY:'New Orleans',OMA:'Omaha',PIT:'Pittsburgh',RDU:'Raleigh-Durham',
  RSW:'Fort Myers',SAN:'San Diego',SAT:'San Antonio',STL:'St Louis',
  TPA:'Tampa',TUL:'Tulsa',TVC:'Traverse City',LAS:'Las Vegas',
  PDX:'Portland',FLL:'Fort Lauderdale',LEX:'Lexington',BUF:'Buffalo',
  YYZ:'Toronto',YUL:'Montreal',LHR:'London',CDG:'Paris',
  FRA:'Frankfurt',AMS:'Amsterdam',DXB:'Dubai',NRT:'Tokyo',
};

const FTYPES = {
  B738:'Boeing 737-800',B739:'Boeing 737-900',
  B37M:'737 MAX 7',B38M:'737 MAX 8',B39M:'737 MAX 9',
  A319:'Airbus A319',A320:'Airbus A320',A321:'Airbus A321',
  A20N:'A320neo',A21N:'A321neo',A19N:'Airbus A220',
  B752:'Boeing 757-200',B763:'Boeing 767-300',
  B772:'Boeing 777-200',B77W:'Boeing 777-300ER',
  B788:'Boeing 787-8',B789:'Boeing 787-9',B78X:'Boeing 787-10',
  B744:'Boeing 747-400',A332:'Airbus A330-200',A333:'Airbus A330-300',
  A359:'Airbus A350-900',A380:'Airbus A380',
  E175:'Embraer E175',E75L:'Embraer E175',E190:'Embraer E190',
  CRJ7:'CRJ-700',CRJ9:'CRJ-900',
};

const AL_NAMES = {
  DAL:'Delta Air Lines',UAL:'United Airlines',AAL:'American Airlines',
  SWA:'Southwest Airlines',AAY:'Allegiant Air',NKS:'Spirit Airlines',
  ASA:'Alaska Airlines',JBU:'JetBlue',FFT:'Frontier Airlines',
  ENY:'Envoy Air',GJS:'GoJet Airlines',RPA:'Republic Airways',
  SKW:'SkyWest Airlines',PDT:'Piedmont Airlines',
  ACA:'Air Canada',WJA:'WestJet',DLH:'Lufthansa',
  BAW:'British Airways',AFR:'Air France',KLM:'KLM',
  IBE:'Iberia',EZY:'easyJet',RYR:'Ryanair',SAS:'Scandinavian',
  FIN:'Finnair',THY:'Turkish Airlines',UAE:'Emirates',
  QTR:'Qatar Airways',ETD:'Etihad Airways',SIA:'Singapore Airlines',
  CPA:'Cathay Pacific',QFA:'Qantas',ANZ:'Air New Zealand',
  KAL:'Korean Air',JAL:'Japan Airlines',ANA:'All Nippon Airways',
};

function icaoFrom(cs){ return (cs||'').replace(/\d.*$/,'').toUpperCase(); }

function liveryImg(icao, tc){
  if(!HAS_LIVERY.has(icao)) return null;
  const t = TYPE_MAP[tc];
  if(!t) return null;
  return `/liveries/${icao}_${t}.webp`;
}
function logoImg(icao, v){ return HAS_LOGO.has(icao) ? `/logos/${icao}_${v}.png` : null; }

let uLat=null, uLon=null, last=[];
const RC={};
let rQ=Promise.resolve();

function fetchT(url,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms||9000);
  return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));
}
function hav(a1,b1,a2,b2){
  if(!a2||!b2)return Infinity;
  const R=3958.8,dr=(a2-a1)*Math.PI/180,dc=(b2-b1)*Math.PI/180;
  const a=Math.sin(dr/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dc/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function brng(a1,b1,a2,b2){
  const dL=(b2-b1)*Math.PI/180,y=Math.sin(dL)*Math.cos(a2*Math.PI/180);
  const x=Math.cos(a1*Math.PI/180)*Math.sin(a2*Math.PI/180)-Math.sin(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.cos(dL);
  return((Math.atan2(y,x)*180/Math.PI)+360)%360;
}
function cmp(d){return['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];}
function dst(mi){
  if(mi<=10) return{lbl:'OVERHEAD',dot:'#50C878',op:1.0};
  if(mi<=25) return{lbl:'NEARBY',  dot:'#F5A623',op:0.9};
  if(mi<=50) return{lbl:'IN RANGE',dot:'#C4821C',op:0.7};
  return        {lbl:'DISTANT', dot:'#555',   op:0.5};
}

async function lookupRoute(cs){
  if(RC[cs]!==undefined)return;
  RC[cs]=null;
  rQ=rQ.then(()=>new Promise(r=>setTimeout(r,1800))).then(async()=>{
    try{
      const r=await fetchT(`https://airlabs.co/api/v9/flight?flight_icao=${encodeURIComponent(cs)}&api_key=${AIRLABS}`,9000);
      if(r.ok){const d=await r.json();const f=d?.response;if(f?.dep_iata&&f?.arr_iata){RC[cs]={from:f.dep_iata,to:f.arr_iata};render(last);}}
    }catch(e){}
  });
}

async function fetchFlights(){
  if(!uLat)return;
  try{
    const la=uLat.toFixed(4),lo=uLon.toFixed(4);
    const urls=[
      `/.netlify/functions/flights?lat=${la}&lon=${lo}&radius=${RADIUS}`,
      `https://api.adsb.lol/v2/lat/${la}/lon/${lo}/dist/${RADIUS}`,
    ];
    let resp=null;
    for(const u of urls){try{const t=await fetchT(u,10000);if(t.ok){resp=t;break;}}catch(e){continue;}}
    if(!resp)throw new Error('No signal');
    const d=await resp.json();
    const ac=(d.ac||[])
      .filter(a=>{if(!a.flight)return false;const cs=a.flight.trim().toUpperCase();return/^[A-Z]{2,3}\d/.test(cs)&&!/^N\d/.test(cs);})
      .map(a=>({...a,_d:hav(uLat,uLon,a.lat,a.lon)}))
      .filter(a=>isFinite(a._d)).sort((a,b)=>a._d-b._d).slice(0,3);
    ac.forEach(a=>{if(a.dep_iata&&a.arr_iata){const cs=a.flight.trim().toUpperCase();if(RC[cs]===undefined)RC[cs]={from:a.dep_iata,to:a.arr_iata};}});
    last=ac; render(ac);
    ac.forEach(a=>{const cs=a.flight.trim().toUpperCase();if(RC[cs]===undefined)lookupRoute(cs);});
    document.getElementById('upd').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});
  }catch(e){
    console.warn('[fetch]',e.message);
    document.getElementById('r0').innerHTML='<div class="pempty" style="opacity:.4">NO SIGNAL</div>';
  }
}

function render(ac){
  for(let i=0;i<3;i++){
    const row=document.getElementById('r'+i);
    const a=ac[i];
    if(!a){row.innerHTML='<div class="pempty">&#8212;</div>';row.style.opacity='';row.style.borderLeft='';continue;}

    const cs    = a.flight.trim().toUpperCase();
    const icao  = icaoFrom(cs);
    const tc    = (a.t||'').toUpperCase();
    const route = RC[cs];
    const ds    = dst(a._d);
    const dir   = uLat&&a.lat ? ' '+cmp(brng(uLat,uLon,a.lat,a.lon)) : '';
    const distTxt = a._d.toFixed(1)+' MI'+(ds.lbl==='OVERHEAD'?'':dir);

    // -- Image: livery first, logo fallback --
    const livSrc  = liveryImg(icao, tc);
    const logoSrc = logoImg(icao,'logo-white') || logoImg(icao,'logo-transparent') || logoImg(icao,'logo');

    console.log('[img]',cs,'icao:',icao,'tc:',tc,'livery:',livSrc,'logo:',logoSrc);

    let imgHTML;
    if(livSrc){
      // Try livery; on error try logo; on error remove
      const fbLogo = logoSrc ? `this.onerror=null;this.className='fallback';this.src='${logoSrc}'` : `this.style.display='none'`;
      imgHTML = `<img class="livery" src="${livSrc}" alt="${cs}" onerror="${fbLogo}"/>`;
    } else if(logoSrc){
      imgHTML = `<img class="fallback" src="${logoSrc}" alt="${icao}"/>`;
    } else {
      imgHTML = `<div class="no-img">${icao}</div>`;
    }

    // Route with HTML entities (no unicode arrows)
    const from = route?.from||'';
    const to   = route?.to  ||'';
    const routeStr = from&&to
      ? `${from} &nbsp;&#8212;&nbsp; ${to}`
      : route===null ? '' : '<span style="opacity:.2;font-size:.6em">&#183;&#183;&#183;</span>';
    const cityStr = from&&to ? `${AP[from]||from} &rarr; ${AP[to]||to}` : '';
    const typeName = FTYPES[tc]||tc||'';
    const alName = AL_NAMES[icao]||icao;

    row.style.opacity    = ds.op;
    row.style.borderLeft = `3px solid ${ds.dot}28`;
    row.classList.add('fadein');

    row.innerHTML = `
      <div class="pimg">${imgHTML}</div>
      <div class="pinfo">
        <div class="pfl">${cs}</div>
        <div class="palbadge">
          <span class="bdot" style="background:${ds.dot}"></span>
          <span class="plbl">${alName} &nbsp;&middot;&nbsp; ${ds.lbl}</span>
        </div>
        ${routeStr ? `<div class="pro">${routeStr}</div>` : ''}
        ${cityStr  ? `<div class="pci">${cityStr}</div>`  : ''}
        <div class="pdist" style="color:${ds.dot}">${distTxt}</div>
        ${typeName ? `<div class="pty">${typeName}</div>` : ''}
      </div>`;
  }
}

function showZip(){
  document.getElementById('zo').classList.add('show');
  const zi=document.getElementById('zi'),zb=document.getElementById('zb'),ze=document.getElementById('ze');
  const go=()=>{const z=zi.value.trim();if(!/^\d{5}$/.test(z)){ze.textContent='ENTER 5-DIGIT ZIP';return;}ze.textContent='';document.getElementById('zo').classList.remove('show');resolveZip(z);};
  zb.onclick=go;zi.onkeydown=e=>{if(e.key==='Enter')go();};
  setTimeout(()=>zi.focus(),100);
}
async function resolveZip(zip){
  document.getElementById('loc').textContent='RESOLVING...';
  try{
    const r=await fetchT(`https://api.zippopotam.us/us/${zip}`,6000);
    if(!r.ok)throw new Error();
    const d=await r.json();
    uLat=parseFloat(d.places[0].latitude);uLon=parseFloat(d.places[0].longitude);
    document.getElementById('loc').textContent=d.places[0]['place name'].toUpperCase()+', '+d.places[0]['state abbreviation'];
    localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));localStorage.setItem('oh_zip',zip);
    fetchFlights();
  }catch(e){document.getElementById('loc').textContent='ZIP ERROR';showZip();}
}
function initLoc(){
  const s=localStorage.getItem('oh_ll')||localStorage.getItem('flightboard_loc');
  if(s){try{[uLat,uLon]=JSON.parse(s);document.getElementById('loc').textContent=Math.abs(uLat).toFixed(3)+'&#176; N, '+Math.abs(uLon).toFixed(3)+'&#176; W';fetchFlights();}catch(e){uLat=null;}}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{uLat=p.coords.latitude;uLon=p.coords.longitude;localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));document.getElementById('loc').textContent=uLat.toFixed(3)+'&#176; N, '+Math.abs(uLon).toFixed(3)+'&#176; W';fetchFlights();},
      ()=>{if(!uLat){const z=localStorage.getItem('oh_zip');if(z)resolveZip(z);else showZip();}},
      {timeout:8000,maximumAge:300000}
    );
  }else if(!uLat)showZip();
}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});}
setInterval(tick,1000);tick();
setInterval(fetchFlights,30000);
initLoc();
</script>
</body>
</html>
