<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVERHEAD</title>
<style>
/* -- Poster palettes -- */
:root{ --bg:#9B1B1B; --fg:#F7F0E3; --fg2:rgba(247,240,227,0.55); --line:rgba(247,240,227,0.14); }
[data-theme="midnight"]{ --bg:#10141C; --fg:#EFE9DC; --fg2:rgba(239,233,220,0.5); --line:rgba(239,233,220,0.1); }
[data-theme="navy"]    { --bg:#1B2B4A; --fg:#F0EADB; --fg2:rgba(240,234,219,0.55); --line:rgba(240,234,219,0.12); }
[data-theme="dusk"]    { --bg:#3E3552; --fg:#F5EDE0; --fg2:rgba(245,237,224,0.55); --line:rgba(245,237,224,0.12); }
[data-theme="marine"]  { --bg:#0F3B3A; --fg:#EFEADF; --fg2:rgba(239,234,223,0.55); --line:rgba(239,234,223,0.12); }
[data-theme="mustard"] { --bg:#B8860B; --fg:#1E1810; --fg2:rgba(30,24,16,0.6); --line:rgba(30,24,16,0.15); }
[data-theme="cream"]   { --bg:#F2ECDF; --fg:#20180F; --fg2:rgba(32,24,15,0.55); --line:rgba(32,24,15,0.12); }

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .6s,color .5s;}
body{font-family:Georgia,'Times New Roman',serif;}

#poster{
  height:100vh;display:flex;flex-direction:column;
  padding:clamp(20px,3.5vh,44px) clamp(28px,4vw,64px) clamp(14px,2.2vh,28px);
}

/* -- Masthead -- */
#mast{
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
  opacity:.4;transition:opacity .4s;
}
#mast:hover{opacity:1;}
.mast-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--fg2);opacity:.25;
  cursor:pointer;user-select:none;
  transition:opacity .3s, transform .3s;
}
.mast-dot:hover{opacity:.7;transform:scale(1.3);}
.mast-ctrl{display:flex;gap:14px;align-items:baseline;}
.mbtn{
  font-family:Georgia,serif;background:none;border:none;color:var(--fg2);
  font-size:clamp(7px,.65vw,9px);letter-spacing:.3em;cursor:pointer;
  text-transform:uppercase;padding:2px 0;border-bottom:1px solid transparent;
}
.mbtn:hover,.mbtn.on{color:var(--fg);border-bottom-color:var(--fg2);}

/* -- Palette popup -- */
#palette{display:none;position:fixed;top:clamp(48px,7vh,80px);left:clamp(28px,4vw,64px);z-index:300;flex-direction:column;gap:10px;padding:12px 14px;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);border-radius:3px;}
#palette.show{display:flex;}
.pal-swatches{display:flex;gap:8px;}
.pal-divider{height:1px;background:rgba(255,255,255,.12);}
.pal-toggles{display:flex;gap:10px;justify-content:center;}
.ptog{
  font-family:Georgia,serif;background:none;
  border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.55);
  font-size:8px;letter-spacing:.25em;cursor:pointer;
  text-transform:uppercase;padding:5px 12px;border-radius:2px;
  transition:all .25s;
}
.ptog:hover{color:#fff;border-color:rgba(255,255,255,.4);}
.ptog.on{color:#fff;border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);}
.sw:hover,.sw.act{border-color:#fff;}

/* -- Plane stage -- */
#stage{flex:1;display:flex;flex-direction:column;min-height:0;justify-content:space-evenly;padding:clamp(6px,1.5vh,20px) 0;}

.slot{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;min-height:0;overflow:visible;
  position:relative;
  transition:opacity .35s ease;
}

/* Plane image — centered, dominant */
.plane-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;overflow:visible;
  padding:0 clamp(10px,2vw,40px);
}
/* Alternate stagger like the poster */
.slot:nth-child(1) .plane-wrap{justify-content:flex-start;padding-left:clamp(20px,5vw,90px);}
.slot:nth-child(2) .plane-wrap{justify-content:flex-end;padding-right:clamp(20px,5vw,90px);}
.slot:nth-child(3) .plane-wrap{justify-content:center;}

.plane-wrap img.livery{
  max-width:min(88%, 1400px); max-height:100%;
  width:auto;height:auto;
  object-fit:contain;display:block;
  filter:drop-shadow(0 10px 34px rgba(0,0,0,.32));
}

}

/* Caption — one small line under the plane, aligned with the stagger */
.plane-cap{
  flex-shrink:0;
  font-size:clamp(7px,.72vw,10px);
  letter-spacing:.12em;color:var(--fg2);
  padding:2px clamp(30px,6vw,110px) 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot:nth-child(1) .plane-cap{text-align:left;}
.slot:nth-child(2) .plane-cap{text-align:right;}
.slot:nth-child(3) .plane-cap{text-align:center;}
.plane-cap b{font-weight:400;color:var(--fg);letter-spacing:.14em;}
.plane-cap .sep{margin:0 .6em;opacity:.5;}

/* --- PORTRAIT / POSTER MODE --- */
@media (orientation:portrait){
  #poster{padding:clamp(24px,4vh,56px) clamp(18px,5vw,44px) clamp(16px,2.5vh,32px);}

  /* Tighter slot rhythm — plane and caption as one unit */
  #stage{justify-content:space-evenly;gap:0;}
  .slot{justify-content:flex-end;gap:0;}

  /* Planes: full width, hug their captions */
  .plane-wrap{
    align-items:flex-end;
    padding:0 !important;
    justify-content:center !important;   /* no stagger in portrait */
  }
  .plane-wrap img.livery{
    max-width:96%;
    max-height:92%;
  }

  /* Gentle alternating alignment via caption instead of plane position */
  .plane-cap{
    padding:6px 4px 0;
    text-align:center !important;
    font-size:clamp(8px,2.4vw,13px);
    letter-spacing:.1em;
    white-space:normal;          /* allow 2-line wrap on narrow walls */
    line-height:1.5;
  }

  /* Colophon slightly larger for poster legibility */
  #colophon{
    font-size:clamp(7px,1.8vw,11px);
    padding-top:clamp(12px,2vh,20px);
    white-space:normal;line-height:1.6;
  }
  #colophon .rule{width:clamp(16px,6vw,40px);margin:0 clamp(8px,2.5vw,16px);}
}


#stage{position:relative;}

/* -- Footer — single poster line -- */
#colophon{
  flex-shrink:0;padding-top:clamp(10px,1.6vh,18px);
  text-align:center;
  font-style:italic;
  font-size:clamp(8px,.82vw,12px);
  letter-spacing:.08em;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#colophon .num{
  font-style:normal;
  letter-spacing:.15em;
  opacity:.75;
}
#colophon .rule{
  display:inline-block;
  width:clamp(20px,3vw,44px);height:1px;
  background:var(--line);
  vertical-align:middle;
  margin:0 clamp(10px,1.5vw,22px);
}

.empty-note{
  text-align:center;font-size:clamp(8px,.8vw,11px);
  letter-spacing:.35em;color:var(--fg2);opacity:.5;
  text-transform:uppercase;
}

/* -- ZIP -- */
#zo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Georgia,serif;}
#zo.show{display:flex;}
.zt{font-size:9px;letter-spacing:.45em;color:rgba(255,255,255,.5);text-transform:uppercase;}
#zi{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;font-family:Georgia,serif;font-size:26px;letter-spacing:.35em;padding:8px 4px;width:170px;text-align:center;outline:none;}
#zb{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;font-family:Georgia,serif;font-size:8px;letter-spacing:.35em;padding:10px 22px;cursor:pointer;text-transform:uppercase;margin-top:6px;}
</style>

const DEMO_SCENES=[

    {cs:'KAL',tc:'B744',name:'Korean Air',from:'ICN',to:'JFK',alt:38000},
    {cs:'DAL',tc:'A359',name:'Delta Air Lines',from:'DTW',to:'AMS',alt:39000},

];
let demoScene=0, demoTimer=null;

function alOf(cs){return(cs||'').replace(/\d.*$/,'').toUpperCase();}
function fmtDate(){
  const d=new Date();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
// Default type per airline when ADS-B type is missing/unknown
const DEFAULT_TYPE={DAL:'738',UAL:'738',AAL:'321',SWA:'738',AAY:'320',NKS:'320',
ASA:'738',JBU:'320',FFT:'320',ENY:'E75',GJS:'CR9',RPA:'E75',SKW:'E75',
ACA:'738',WJA:'738',DLH:'738',BAW:'77W',AFR:'320',KLM:'738',IBE:'320',
EZY:'320',RYR:'738',SAS:'320',FIN:'320',THY:'738',UAE:'388',QTR:'789',
ETD:'789',SIA:'359',CPA:'359',QFA:'738',ANZ:'789',KAL:'77W',JAL:'789',ANA:'789'};

function livSrc(icao,tc){
  if(!HAS_LIVERY.has(icao))return null;
  const t=TMAP[tc]||DEFAULT_TYPE[icao];
  return t?`/liveries/${icao}_${t}.webp`:null;
}

let uLat=null,uLon=null,last=[],demoMode=false,posterNum=Math.floor(Math.random()*900)+100;
const RC={};let rQ=Promise.resolve();

function fetchT(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||9000);
  return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t));}
function hav(a1,b1,a2,b2){if(!a2||!b2)return Infinity;
  const R=3958.8,dr=(a2-a1)*Math.PI/180,dc=(b2-b1)*Math.PI/180;
  const a=Math.sin(dr/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dc/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

async function lookupRoute(cs){
  if(RC[cs]!==undefined)return;RC[cs]=null;
  rQ=rQ.then(()=>new Promise(r=>setTimeout(r,1800))).then(async()=>{
    try{const r=await fetchT(`https://airlabs.co/api/v9/flight?flight_icao=${encodeURIComponent(cs)}&api_key=${AIRLABS}`,9000);
      if(r.ok){const d=await r.json();const f=d?.response;
        if(f?.dep_iata&&f?.arr_iata){RC[cs]={from:f.dep_iata,to:f.arr_iata};render(last);}}}catch(e){}});
}

async function fetchFlights(){
  if(!uLat||demoMode)return;
  const la=uLat.toFixed(4),lo=uLon.toFixed(4);
  // Single fetch at max radius — closest 3 naturally rise to the top.
  // No expanding loop, no churn when flights enter/leave inner rings.
  const R=100;
  let best=null;   // null = fetch failed entirely (keep previous display)
  try{
    const urls=[`/.netlify/functions/flights?lat=${la}&lon=${lo}&radius=${R}`,
                `https://api.adsb.lol/v2/lat/${la}/lon/${lo}/dist/${R}`];
    let resp=null;
    for(const u of urls){try{const t=await fetchT(u,10000);if(t.ok){resp=t;break;}}catch(e){continue;}}
    if(resp){
      const d=await resp.json();
      best=(d.ac||[]).filter(a=>{
        if(!a.flight)return false;
        const cs=a.flight.trim().toUpperCase();
        if(!/^[A-Z]{2,3}\d/.test(cs)||/^N\d/.test(cs))return false;
        return livSrc(alOf(cs),(a.t||'').toUpperCase())!==null;
      }).map(a=>({...a,_d:hav(uLat,uLon,a.lat,a.lon)}))
        .filter(a=>isFinite(a._d)).sort((a,b)=>a._d-b._d).slice(0,3);
    }
  }catch(e){}

  if(best===null){
    // Total fetch failure — keep showing what we had, try again next cycle
    console.warn('[fetch] failed, keeping previous display');
    return;
  }
  if(best.length===0 && last.length>0){
    // Empty result but we had flights 30s ago — likely a data hiccup.
    // Keep previous display for one more cycle rather than blanking.
    console.warn('[fetch] empty result, holding previous flights one cycle');
    last._staleCount=(last._staleCount||0)+1;
    if(last._staleCount<3)return;   // hold up to 3 cycles (90s) before clearing
  }

  best.forEach(a=>{if(a.dep_iata&&a.arr_iata){const cs=a.flight.trim().toUpperCase();
    if(RC[cs]===undefined)RC[cs]={from:a.dep_iata,to:a.arr_iata};}});
  last=best;render(best);
  best.forEach(a=>{const cs=a.flight.trim().toUpperCase();if(RC[cs]===undefined)lookupRoute(cs);});
}

function capLine(alName,typeName,route,alt,dist){
  const bits=[];
  bits.push(`<b>${alName}</b>`);
  if(typeName)bits.push(typeName);
  if(route)bits.push(route);
  if(alt)bits.push(alt.toLocaleString()+' ft');
  if(dist)bits.push(dist);
  return bits.join('<span class="sep">&middot;</span>');
}

function slotHTML(src,cap){
  return `
    <div class="plane-wrap">
      <img class="livery" src="${src}" onerror="this.style.opacity='0'"/>
    </div>
    <div class="plane-cap">${cap}</div>`;
}

function renderDemo(){
  const scene=DEMO_SCENES[demoScene];
  scene.forEach((p,i)=>{
    // tc may be an ADS-B code (B744) or a direct file code (744, 77W)
    const t=TMAP[p.tc]||p.tc;
    const src=`/liveries/${p.cs}_${t}.webp`;
    const route=(AP[p.from]||p.from)+' &ndash; '+(AP[p.to]||p.to);
    const cap=capLine(p.name,FTYPES[p.tc]||'',route,p.alt,'');
    const slot=document.getElementById('s'+i);
    slot.style.opacity='0';
    setTimeout(()=>{slot.innerHTML=slotHTML(src,cap);slot.style.opacity='1';},350);
  });
  document.getElementById('colophon').innerHTML=
    `<span class="rule"></span><span class="num">&#8470; ${posterNum}</span>&ensp;&mdash;&ensp;Received ${fmtDate()}, three aircraft in composition<span class="rule"></span>`;
}

function render(ac){
  if(demoMode)return;
  for(let i=0;i<3;i++){
    const slot=document.getElementById('s'+i);
    const a=ac[i];
    if(!a){slot.innerHTML=i===0&&ac.length===0?'<div class="empty-note">Listening for aircraft</div>':'';continue;}
    const cs=a.flight.trim().toUpperCase();
    const icao=alOf(cs),tc=(a.t||'').toUpperCase();
    const route=RC[cs];
    const routeStr=route?.from&&route?.to?(AP[route.from]||route.from)+' &ndash; '+(AP[route.to]||route.to):'';
    const alt=a.alt_baro&&a.alt_baro!=='ground'?parseInt(a.alt_baro):null;
    const dist=a._d<=10?a._d.toFixed(1)+' mi overhead':a._d.toFixed(1)+' mi away';
    const cap=capLine(ALNAMES[icao]||icao,FTYPES[tc]||'',routeStr,alt,dist);
    slot.innerHTML=slotHTML(livSrc(icao,tc),cap);
  }
  // Colophon: ? · date · coords · location · N aircraft
  if(uLat){
    const coords=Math.abs(uLat).toFixed(4)+'\u00b0'+(uLat>=0?'N':'S')+' '+Math.abs(uLon).toFixed(4)+'\u00b0'+(uLon>=0?'E':'W');
    const locName=localStorage.getItem('oh_city')||'';
    const over=locName?` over ${locName}`:'';
    const n=ac.length===1?'one aircraft':ac.length===2?'two aircraft':ac.length===3?'three aircraft':ac.length+' aircraft';
    document.getElementById('colophon').innerHTML=
      `<span class="rule"></span><span class="num">&#8470; ${posterNum}</span>&ensp;&mdash;&ensp;Received ${fmtDate()}${over}, ${coords}, ${n}<span class="rule"></span>`;
  }
}

// -- Controls --
function togglePalette(){document.getElementById('palette').classList.toggle('show');}
document.addEventListener('click',e=>{
  const p=document.getElementById('palette');
  if(!p.contains(e.target)&&e.target.id!=='brand')p.classList.remove('show');});
document.querySelectorAll('.sw').forEach(s=>{
  s.addEventListener('click',()=>{
    document.body.setAttribute('data-theme',s.dataset.t);
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('act'));
    s.classList.add('act');
    localStorage.setItem('oh_theme',s.dataset.t);});});
const st=localStorage.getItem('oh_theme');
if(st){document.body.setAttribute('data-theme',st);
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('act',s.dataset.t===st));}



function toggleDemo(){
  demoMode=!demoMode;
  document.getElementById('demobtn').classList.toggle('on',demoMode);
  if(demoMode){
    demoScene=0;
    renderDemo();
    demoTimer=setInterval(()=>{
      demoScene=(demoScene+1)%DEMO_SCENES.length;
      renderDemo();
    },30000);
  }else{
    clearInterval(demoTimer);demoTimer=null;
    render(last);
  }
}

// -- Location --
function showZip(){
  document.getElementById('zo').classList.add('show');
  const zi=document.getElementById('zi'),zb=document.getElementById('zb'),ze=document.getElementById('ze');
  const go=()=>{const z=zi.value.trim();if(!/^\d{5}$/.test(z)){ze.textContent='Enter a valid ZIP';return;}
    ze.textContent='';document.getElementById('zo').classList.remove('show');resolveZip(z);};
  zb.onclick=go;zi.onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>zi.focus(),100);}
async function resolveZip(z){
  try{
    const r=await fetchT(`https://api.zippopotam.us/us/${z}`,6000);if(!r.ok)throw 0;
    const d=await r.json();
    uLat=parseFloat(d.places[0].latitude);uLon=parseFloat(d.places[0].longitude);
    localStorage.setItem('oh_city',d.places[0]['place name']);
    localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));localStorage.setItem('oh_zip',z);
    fetchFlights();
  }catch(e){showZip();}}
function initLoc(){
  const s=localStorage.getItem('oh_ll')||localStorage.getItem('flightboard_loc');
  if(s){try{[uLat,uLon]=JSON.parse(s);fetchFlights();}catch(e){uLat=null;}}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{uLat=p.coords.latitude;uLon=p.coords.longitude;
        localStorage.setItem('oh_ll',JSON.stringify([uLat,uLon]));fetchFlights();},
      ()=>{if(!uLat){const z=localStorage.getItem('oh_zip');if(z)resolveZip(z);else showZip();}},
      {timeout:8000,maximumAge:300000});
  }else if(!uLat)showZip();}

setInterval(fetchFlights,30000);
initLoc();
</script>
