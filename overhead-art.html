<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVERHEAD</title>
<style>
:root {
  --bg: #060A0D;
  --amber: #F5A623;
  --amber2: #FFCC66;
  --dim: rgba(245,166,35,0.45);
  --line: rgba(245,166,35,0.09);
  --line2: rgba(245,166,35,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--amber); font-family:'Courier New',monospace; }

#app { height:100vh; display:flex; flex-direction:column; padding:16px 40px 12px; }

/* ── Header ── */
#hdr {
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:1px solid var(--line2);
  padding-bottom:10px; flex-shrink:0; margin-bottom:0;
}
.ht { font-size:9px; letter-spacing:7px; opacity:.4; }
.hl { font-size:10px; letter-spacing:3px; opacity:.65; }
.hc { font-size:11px; letter-spacing:2px; opacity:.3; font-variant-numeric:tabular-nums; }

/* ── Plane rows ── */
#rows { flex:1; display:flex; flex-direction:column; min-height:0; }

.prow {
  flex:1; display:flex; align-items:center;
  border-bottom:1px solid var(--line);
  overflow:hidden; min-height:0; position:relative;
}
.prow:last-child { border-bottom:none; }

.part {
  flex:0 0 62%; height:100%;
  display:flex; align-items:center;
  padding:8px 0 8px 0;
  overflow:hidden; min-width:0;
}
.part svg {
  width:100%; height:100%;
  display:block;
  overflow:visible;
}

.pinfo {
  flex:1; padding:0 0 0 28px;
  border-left:1px solid var(--line2);
  display:flex; flex-direction:column; justify-content:center;
  gap:3px; min-width:0; overflow:hidden;
}

.pfl  { font-size:clamp(16px,2.6vw,32px); letter-spacing:5px; font-weight:700; white-space:nowrap; }
.pan  { font-size:clamp(7px,.85vw,10px); letter-spacing:4px; opacity:.4; margin-top:2px; }
.pro  { font-size:clamp(13px,2vw,24px); letter-spacing:4px; margin-top:5px; white-space:nowrap; }
.pci  { font-size:clamp(7px,.8vw,9px); letter-spacing:2px; opacity:.38; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pst  { display:flex; gap:clamp(10px,2vw,24px); margin-top:6px; }
.psv  { font-size:clamp(10px,1.3vw,16px); letter-spacing:2px; }
.psl  { font-size:clamp(6px,.65vw,8px); letter-spacing:2px; opacity:.28; margin-top:1px; }
.pty  { font-size:clamp(7px,.75vw,9px); letter-spacing:3px; opacity:.32; margin-top:4px; }

.pempty { display:flex; align-items:center; width:100%; opacity:.08; font-size:10px; letter-spacing:6px; padding-left:4px; }

/* ── Footer ── */
#ftr {
  flex-shrink:0; border-top:1px solid var(--line); padding-top:9px;
  display:flex; justify-content:space-between;
  font-size:8px; letter-spacing:3px; opacity:.2;
}

/* CRT scanlines */
body::after {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 4px);
  pointer-events:none; z-index:999;
}
body::before {
  content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.4) 100%);
  pointer-events:none; z-index:998;
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="ht">✈ &nbsp; OVERHEAD</div>
    <div class="hl" id="loc">LOCATING...</div>
    <div class="hc" id="clk">--:--:--</div>
  </div>
  <div id="rows">
    <div class="prow" id="r0"><div class="pempty">ACQUIRING SIGNAL...</div></div>
    <div class="prow" id="r1"><div class="pempty">— &nbsp; — &nbsp; —</div></div>
    <div class="prow" id="r2"><div class="pempty">— &nbsp; — &nbsp; —</div></div>
  </div>
  <div id="ftr">
    <span>ADS-B · AIRLABS</span>
    <span id="upd">—</span>
    <span id="radius-lbl">10 MI RADIUS</span>
  </div>
</div>

<!-- ZIP overlay — shown when GPS unavailable -->
<div id="zip-overlay" style="display:none;position:fixed;inset:0;background:rgba(6,10,13,0.96);z-index:2000;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
  <div style="font-size:9px;letter-spacing:6px;color:#F5A623;opacity:.5;">✈ &nbsp; OVERHEAD</div>
  <div style="font-size:11px;letter-spacing:4px;color:#F5A623;opacity:.8;">ENTER YOUR ZIP CODE</div>
  <div style="display:flex;gap:10px;align-items:center;">
    <input id="zip-input" type="text" inputmode="numeric" maxlength="5" placeholder="49315"
      style="background:transparent;border:1px solid rgba(245,166,35,0.4);color:#F5A623;
             font-family:'Courier New',monospace;font-size:20px;letter-spacing:6px;
             padding:10px 16px;width:140px;text-align:center;outline:none;"/>
    <button id="zip-btn"
      style="background:transparent;border:1px solid rgba(245,166,35,0.4);color:#F5A623;
             font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;
             padding:10px 16px;cursor:pointer;">GO</button>
  </div>
  <div id="zip-err" style="font-size:9px;letter-spacing:3px;color:#C8102E;opacity:.8;min-height:14px;"></div>
</div>

  const pfx = (cs||'').replace(/\d.*$/,'').toUpperCase();

// ── Aircraft SVG builders ──
// All aircraft face RIGHT. Flip via heading > 180.

    : 'M196,110 L358,142 L352,152 L244,122Z';

function buildSVG(typeCode, callsign, heading, rowIdx) {
  const shape = getShape(typeCode);
  const L = getLivery(callsign);
  const flip = typeof heading === 'number' && heading > 180;
  const id = rowIdx;
  switch(shape) {
    case 'WB':   return nbSVG(L, id, flip, true);
    case 'RJ':   return rjSVG(L, id, flip);
    case 'CRJ':  return crjSVG(L, id, flip);
    case 'PROP': return rjSVG(L, id, flip); // simplified
    default:     return nbSVG(L, id, flip, false);
  }
}

// ── State ──
let userLat = null, userLon = null;
let lastFlights = [];
const RC = {}; // route cache: key → {from, to} or null
let rQueue = Promise.resolve();

// ── Distance (miles) ──
function mi(a1, b1, a2, b2) {
  if (!a2 || !b2) return Infinity;
  const R=3958.8, dr=(a2-a1)*Math.PI/180, dc=(b2-b1)*Math.PI/180;
  const a=Math.sin(dr/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dc/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── Bearing from user to aircraft ──
function bearing(lat1, lon1, lat2, lon2) {
  const dL = (lon2-lon1)*Math.PI/180;
  const y  = Math.sin(dL)*Math.cos(lat2*Math.PI/180);
  const x  = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)
            - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dL);
  return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
}
function compass(deg) {
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5)%16];
}

// ── Distance tier → display state ──
function distState(miles) {
  if (miles <= 10) return { label:'OVERHEAD', dot:'#50C878', opacity:1.0,   dim:false };
  if (miles <= 25) return { label:'NEARBY',   dot:'#F5A623', opacity:0.82,  dim:false };
  if (miles <= 50) return { label:'IN RANGE', dot:'#C4821C', opacity:0.62,  dim:true  };
  return              { label:'DISTANT',   dot:'#666666', opacity:0.42,  dim:true  };
}

// ── AirLabs route lookup ──
async function lookupRoute(cs) {
  if (RC[cs] !== undefined) return;
  RC[cs] = null;
  rQueue = rQueue
    .then(() => new Promise(r => setTimeout(r, 1600)))
    .then(async () => {
      try {
        const r = await fetch(
          `https://airlabs.co/api/v9/flight?flight_icao=${encodeURIComponent(cs)}&api_key=${AIRLABS_KEY}`,
          { signal: AbortSignal.timeout(8000), cache:'no-store' }
        );
        if (r.ok) {
          const d = await r.json();
          const f = d?.response;
          if (f?.dep_iata && f?.arr_iata) {
            RC[cs] = { from: f.dep_iata, to: f.arr_iata };
            render(lastFlights);
          }
        }
      } catch(e) {}
    });
}

// ── Fetch flights — auto-expanding radius ──
const RADII = [10, 25, 50, 100];
let activeRadius = 10;

async function fetchAt(r) {
  const resp = await fetch(
    `https://api.adsb.lol/v2/lat/${userLat}/lon/${userLon}/dist/${r}`,
    { signal: AbortSignal.timeout(8000), cache:'no-store' }
  );
  const d = await resp.json();
  return (d.ac||[])
    .filter(a => {
      if (!a.flight) return false;
      const cs = a.flight.trim().toUpperCase();
      return /^[A-Z]{2,3}\d/.test(cs) && !/^N\d/.test(cs);
    })
    .map(a => ({ ...a, _d: mi(userLat, userLon, a.lat, a.lon) }))
    .filter(a => isFinite(a._d))
    .sort((a,b) => a._d - b._d)
    .slice(0, 3);
}

async function fetchFlights() {
  if (!userLat) return;
  try {
    let ac = [];
    for (const r of RADII) {
      ac = await fetchAt(r);
      activeRadius = r;
      if (ac.length >= 1) break; // found at least one — stop expanding
    }

    // Seed routes from raw ADS-B data
    ac.forEach(a => {
      if (a.dep_iata && a.arr_iata) {
        const cs = a.flight.trim().toUpperCase();
        if (RC[cs] === undefined) RC[cs] = { from: a.dep_iata, to: a.arr_iata };
      }
    });

    lastFlights = ac;
    render(ac);

    // Queue route lookups for unknowns
    ac.forEach(a => {
      const cs = a.flight.trim().toUpperCase();
      if (RC[cs] === undefined) lookupRoute(cs);
    });

    document.getElementById('upd').textContent =
      'UPDATED ' + new Date().toLocaleTimeString('en-US',{hour12:false});
    document.getElementById('radius-lbl').textContent = activeRadius + ' MI RADIUS';
  } catch(e) {
    console.warn('[fetch]', e.message);
    // Show visible error — most likely cause is loading from local file
    const isLocal = location.protocol === 'file:' || location.protocol === 'content:';
    for (let i = 0; i < 3; i++) {
      const row = document.getElementById(`r${i}`);
      if (i === 0) {
        row.innerHTML = isLocal
          ? `<div style="padding:0 20px;font-size:10px;letter-spacing:3px;opacity:.6;line-height:1.8;">
              NETWORK BLOCKED<br>
              <span style="opacity:.5;font-size:9px;">OPEN FROM NETLIFY, NOT LOCAL FILE</span>
            </div>`
          : `<div style="padding:0 20px;font-size:10px;letter-spacing:3px;opacity:.6;">
              FETCH ERROR — ${e.message.toUpperCase()}
            </div>`;
      } else {
        row.innerHTML = '<div class="pempty">— &nbsp; — &nbsp; —</div>';
      }
    }
  }
}

// ── Render ──
function render(ac) {
  for (let i = 0; i < 3; i++) {
    const row = document.getElementById(`r${i}`);
    const a = ac[i];
    if (!a) {
      row.innerHTML = `<div class="pempty">— &nbsp; — &nbsp; —</div>`;
      row.style.opacity = '';
      row.style.borderLeft = '';
      continue;
    }
    const cs   = a.flight.trim().toUpperCase();
    const route = RC[cs];
    const alt  = a.alt_baro && a.alt_baro !== 'ground' ? parseInt(a.alt_baro) : null;
    const spd  = a.gs ? Math.round(a.gs) : null;
    const hdg  = a.track ? Math.round(a.track) : null;
    const tc   = (a.t||'').toUpperCase();
    const typeName = FTYPES[tc] || (tc || '');
    const name = alName(cs);

    // Distance state drives visual treatment
    const state = distState(a._d);
    const brng  = (userLat && a.lat) ? bearing(userLat, userLon, a.lat, a.lon) : null;
    const dir   = brng !== null ? compass(brng) : '';
    const distStr = a._d ? a._d.toFixed(1) : '?';

    // Distance display: overhead just shows miles, others show miles + bearing
    const distDisplay = state.label === 'OVERHEAD'
      ? `${distStr} MI`
      : `${distStr} MI ${dir}`;

    // Apply row-level opacity for dimming
    row.style.opacity = state.opacity;

    // Colored left accent bar based on state
    row.style.borderLeft = `3px solid ${state.dot}40`;

    const svg = buildSVG(tc, cs, hdg, i);

    const from = route?.from || '';
    const to   = route?.to   || '';
    const routeStr = from && to
      ? `${from} &thinsp;→&thinsp; ${to}`
      : route === null
        ? '—'
        : '<span style="opacity:.3;font-size:.7em;letter-spacing:3px">ROUTING...</span>';
    const cityStr = from && to ? `${AP[from]||from} → ${AP[to]||to}` : '';
    const altStr  = alt ? alt.toLocaleString() : '—';
    const spdStr  = spd ? spd : '—';

    // State badge: dot + label
    const badge = `<span style="display:inline-flex;align-items:center;gap:5px;font-size:8px;letter-spacing:3px;opacity:.7;">
      <span style="width:6px;height:6px;border-radius:50%;background:${state.dot};display:inline-block;flex-shrink:0;"></span>
      ${state.label}
    </span>`;

    row.innerHTML = `
      <div class="part" style="opacity:${state.dim ? 0.7 : 1}">${svg}</div>
      <div class="pinfo">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
          <div class="pfl">${cs}</div>
          ${badge}
        </div>
        <div class="pan">${name}</div>
        <div class="pro">${routeStr}</div>
        ${cityStr ? `<div class="pci">${cityStr}</div>` : ''}
        <div class="pst">
          <div><div class="psv">${altStr}</div><div class="psl">FT MSL</div></div>
          <div><div class="psv">${spdStr}</div><div class="psl">KNOTS</div></div>
          <div>
            <div class="psv" style="color:${state.dot}">${distDisplay}</div>
            <div class="psl">DISTANCE</div>
          </div>
          ${hdg !== null ? `<div><div class="psv">${hdg}°</div><div class="psl">HEADING</div></div>` : ''}
        </div>
        ${typeName ? `<div class="pty">${typeName}</div>` : ''}
      </div>`;
  }
}

// ── Location ──
function showZipOverlay() {
  document.getElementById('zip-overlay').style.display = 'flex';
  const input = document.getElementById('zip-input');
  const btn   = document.getElementById('zip-btn');
  const err   = document.getElementById('zip-err');
  const go = () => {
    const z = input.value.trim();
    if (!/^\d{5}$/.test(z)) { err.textContent = 'ENTER A VALID 5-DIGIT ZIP'; return; }
    err.textContent = '';
    document.getElementById('zip-overlay').style.display = 'none';
    resolveZip(z);
  };
  btn.addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => input.focus(), 100);
}

function initLoc() {
  // Try: 1) saved lat/lon from this app
  //      2) saved lat/lon from flightboard (same domain)
  //      3) GPS
  //      4) ZIP overlay
  const saved = localStorage.getItem('oh_latlon') || localStorage.getItem('flightboard_loc');
  if (saved) {
    try {
      [userLat, userLon] = JSON.parse(saved);
      const loc = `${Math.abs(userLat).toFixed(3)}° ${userLat>=0?'N':'S'}, ${Math.abs(userLon).toFixed(3)}° ${userLon>=0?'E':'W'}`;
      document.getElementById('loc').textContent = loc;
      fetchFlights();
    } catch(e) { userLat = null; }
  }
  // Always try GPS to update to current position
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => {
        userLat = p.coords.latitude;
        userLon = p.coords.longitude;
        localStorage.setItem('oh_latlon', JSON.stringify([userLat, userLon]));
        const loc = `${userLat.toFixed(3)}° N, ${Math.abs(userLon).toFixed(3)}° W`;
        document.getElementById('loc').textContent = loc;
        fetchFlights();
      },
      () => {
        // GPS denied/unavailable
        if (!userLat) {
          // No saved location either — show ZIP overlay
          const zip = localStorage.getItem('oh_zip');
          if (zip) resolveZip(zip);
          else showZipOverlay();
        }
        // If we had a saved location, already fetching — GPS failure is fine
      },
      { timeout: 8000, maximumAge: 300000 }
    );
  } else if (!userLat) {
    showZipOverlay();
  }
}

async function resolveZip(zip) {
  document.getElementById('loc').textContent = 'RESOLVING...';
  try {
    const r = await fetch(`https://api.zippopotam.us/us/${zip}`, {signal: AbortSignal.timeout(6000)});
    if (!r.ok) throw new Error('bad zip');
    const d = await r.json();
    userLat = parseFloat(d.places[0].latitude);
    userLon = parseFloat(d.places[0].longitude);
    const city  = d.places[0]['place name'];
    const state = d.places[0]['state abbreviation'];
    document.getElementById('loc').textContent = `${city.toUpperCase()}, ${state}`;
    localStorage.setItem('oh_latlon', JSON.stringify([userLat, userLon]));
    localStorage.setItem('oh_zip', zip);
    fetchFlights();
  } catch(e) {
    document.getElementById('loc').textContent = 'ZIP ERROR';
    const err = document.getElementById('zip-err');
    if (err) err.textContent = 'COULD NOT RESOLVE ZIP — TRY AGAIN';
    showZipOverlay();
  }
}

// ── Clock ──
function tick() {
  document.getElementById('clk').textContent =
    new Date().toLocaleTimeString('en-US',{hour12:false});
}
setInterval(tick, 1000); tick();

// ── Boot ──
setInterval(fetchFlights, 30000);
initLoc();
</script>
